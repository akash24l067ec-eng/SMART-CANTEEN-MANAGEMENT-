<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Canteen Management</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <h1>Smart Canteen Management</h1>
        <p>Live dashboard for users, menus, and kitchen orders.</p>
      </div>
      <button id="refresh" type="button">Refresh</button>
    </header>

    <main>
      <section class="panel">
        <h2>Users</h2>
        <table>
          <thead>
            <tr>
              <th>UID</th>
              <th>Name</th>
              <th>Balance</th>
              <th>Credit</th>
            </tr>
          </thead>
          <tbody id="user-table-body"></tbody>
        </table>

        <form id="user-form" class="inline-form">
          <h3>Add user</h3>
          <label>
            UID
            <input name="uid" required />
          </label>
          <label>
            Name
            <input name="name" required />
          </label>
          <label>
            Balance
            <input name="balance" type="number" step="0.01" value="0" />
          </label>
          <label>
            Credit
            <input name="credit" type="number" step="0.01" value="0" />
          </label>
          <button type="submit">Add user</button>
        </form>
      </section>

      <section class="panel">
        <h2>Menu</h2>
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Price</th>
              <th>Quantity</th>
            </tr>
          </thead>
          <tbody id="menu-table-body"></tbody>
        </table>

        <form id="menu-form" class="inline-form">
          <h3>Add menu item</h3>
          <label>
            Item name
            <input name="name" required />
          </label>
          <label>
            Price
            <input name="price" type="number" step="0.01" required />
          </label>
          <label>
            Quantity
            <input name="quantity" type="number" step="1" required />
          </label>
          <button type="submit">Add item</button>
        </form>
      </section>

      <section class="panel">
        <h2>Kitchen panel</h2>
        <div id="orders"></div>
      </section>
    </main>

    <div id="status" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
